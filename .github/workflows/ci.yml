name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      test-db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U test_user" --health-interval 3s --health-retries 10
      prod-db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prod
          POSTGRES_USER: prod_user
          POSTGRES_PASSWORD: prod_pass
        ports:
          - 5433:5432
        options: --health-cmd "pg_isready -U prod_user" --health-interval 3s --health-retries 10
    env:
      TEST_DB_DSN: postgresql://test_user:test_pass@localhost:5432/test
      PROD_DB_DSN: postgresql://prod_user:prod_pass@localhost:5433/prod
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q
