services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test"]
      interval: 3s
      timeout: 3s
      retries: 10

  prod-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prod
      POSTGRES_USER: prod_user
      POSTGRES_PASSWORD: prod_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prod_user -d prod"]
      interval: 3s
      timeout: 3s
      retries: 10
