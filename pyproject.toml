[project]
name = "dbsync"
version = "0.2.0"
description = "Синхронизация схемы и данных PostgreSQL между тестовой и продуктовой базами"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Roman Medvedev", email = "roma23470@gmail.com" }]
dependencies = [
    "loguru>=0.7",
    "psycopg[binary]>=3.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
dbsync = "dbsync.runner:main"

[project.urls]
Repository = "https://github.com/mellettan/dbsync"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbsync"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: нужны две базы PostgreSQL (TEST_DB_DSN и PROD_DB_DSN)"]
